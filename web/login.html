<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Stealer WebUI - 登录</title>
    <link rel="stylesheet" href="/web/app.css">
    <style>
        :root { --login-card-width: 360px; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 18px;
            background-color: var(--bg-main);
            color: var(--text-main);
            overflow: hidden;
        }
        .login-shell { width: min(var(--login-card-width), calc(100vw - 28px)); position: relative; }
        .login-panel {
            position: relative;
            background: var(--bg-panel);
            border: var(--border-panel);
            border-radius: 14px;
            padding: 24px 22px 20px;
            box-shadow: 0 18px 48px var(--shadow-color), inset 0 0 32px rgba(212, 180, 110, .06);
            backdrop-filter: blur(14px);
            overflow: hidden;
        }
        .login-panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at top, rgba(212,180,110,.16), transparent 42%);
            pointer-events: none;
        }
        .login-content { position: relative; z-index: 1; }
        .brand { text-align: center; margin-bottom: 18px; }
        .brand-icon {
            width: 54px;
            height: 54px;
            margin: 0 auto 10px;
            border-radius: 14px;
            border: 1px solid var(--gold-dim);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--gold-primary);
            background: rgba(0,0,0,.18);
            box-shadow: inset 0 0 18px rgba(212,180,110,.1);
        }
        .brand h1 {
            font-size: 1.25rem;
            letter-spacing: .12em;
            margin: 0;
            color: var(--gold-primary);
        }
        .brand p { margin: 5px 0 0; color: var(--text-muted); font-size: .78rem; }
        .field { margin: 16px 0 12px; }
        .field label {
            display: block;
            color: var(--text-muted);
            font-size: .72rem;
            letter-spacing: .12em;
            text-transform: uppercase;
            margin-bottom: 7px;
        }
        .field input {
            width: 100%;
            height: 38px;
            border-radius: 8px;
            border: 1px solid var(--gold-dim);
            background: rgba(5, 8, 15, .72);
            color: var(--text-main);
            padding: 0 12px;
            outline: none;
            font-size: .9rem;
        }
        .field input:focus {
            border-color: var(--gold-primary);
            box-shadow: 0 0 0 2px rgba(212,180,110,.13);
        }
        .login-btn {
            width: 100%;
            min-height: 38px;
            border: 1px solid var(--gold-primary);
            border-radius: 8px;
            background: linear-gradient(180deg, rgba(212,180,110,.28), rgba(122,99,43,.18));
            color: var(--gold-bright);
            cursor: pointer;
            font-size: .86rem;
            font-weight: 700;
            letter-spacing: .1em;
            text-transform: uppercase;
        }
        .login-btn:hover { background: linear-gradient(180deg, rgba(212,180,110,.36), rgba(122,99,43,.24)); }
        .message { min-height: 18px; margin-top: 10px; text-align: center; color: #fca5a5; font-size: .78rem; }
        .footer-note { margin-top: 14px; text-align: center; color: var(--text-muted); font-size: .68rem; opacity: .78; }
    </style>
</head>
<body>
    <main class="login-shell">
        <section class="login-panel">
            <div class="login-content">
                <div class="brand">
                    <div class="brand-icon">
                        <svg style="width:28px;height:28px" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
                        </svg>
                    </div>
                    <h1>Stealer WebUI</h1>
                    <p>表情包管理 · 独立访问</p>
                </div>
                <form id="loginForm">
                    <div class="field">
                        <label for="password">Access Token</label>
                        <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入访问密码" autofocus required>
                    </div>
                    <button class="login-btn" id="submitBtn" type="submit">进入面板</button>
                    <div class="message" id="message"></div>
                </form>
                <div class="footer-note">Stealer WebUI Standalone</div>
            </div>
        </section>
    </main>

    <script>
        const form = document.getElementById('loginForm');
        const btn = document.getElementById('submitBtn');
        const msg = document.getElementById('message');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            msg.textContent = '';
            btn.disabled = true;
            btn.textContent = '验证中...';
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({password: document.getElementById('password').value})
                });
                const data = await res.json();
                if (data.success) location.href = '/';
                else msg.textContent = data.error || '登录失败';
            } catch (err) {
                msg.textContent = '网络错误，请稍后重试';
            } finally {
                btn.disabled = false;
                btn.textContent = '进入面板';
            }
        });
    </script>
</body>
</html>
